server:
  address: 127.0.0.1
  port: ${TASKSHELF_MCP_PORT:8092}

spring:
  application:
    name: taskshelf-mcp-http-server
  threads:
    virtual:
      enabled: true
  ai:
    mcp:
      server:
        enabled: true
        name: taskshelf-mcp-http-server
        version: 1.0.0
        type: SYNC
        protocol: STREAMABLE
        stdio: false
        instructions: Read-only fictional TaskShelf catalog. Tools read public metadata, resources provide context, prompts only return templates.
        request-timeout: 5s
        tool-change-notification: false
        resource-change-notification: false
        prompt-change-notification: false
        capabilities:
          tool: true
          resource: true
          prompt: true
          completion: false
        streamable-http:
          mcp-endpoint: /mcp
          disallow-delete: false

taskshelf:
  access-token: ${TASKSHELF_MCP_TOKEN:course-local-token}
